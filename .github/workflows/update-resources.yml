name: Update MAA resources

# Deliberately manual-only: no schedule, push or pull_request triggers.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: ArknightsGameData branch, tag, or full commit SHA
        required: true
        default: master
        type: string
      tile_source_ref:
        description: MaaResource branch, tag, or full commit SHA
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: publish-mapping-resources
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out generator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test generator
        run: python -m unittest discover -s tests -v
      - name: Check out three upstream tables at a fixed commit
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Kengxxiao/ArknightsGameData.git upstream
          git -C upstream fetch --depth 1 -- origin "$SOURCE_REF"
          git -C upstream checkout --detach FETCH_HEAD
          git -C upstream sparse-checkout set --no-cone /zh_CN/gamedata/excel/character_table.json /zh_CN/gamedata/excel/char_patch_table.json /zh_CN/gamedata/excel/stage_table.json
          printf 'SOURCE_COMMIT=%s\n' "$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Check out MAA tile maps at a fixed commit
        env:
          TILE_SOURCE_REF: ${{ inputs.tile_source_ref }}
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/MaaAssistantArknights/MaaResource.git upstream-tiles
          git -C upstream-tiles fetch --depth 1 -- origin "$TILE_SOURCE_REF"
          git -C upstream-tiles checkout --detach FETCH_HEAD
          git -C upstream-tiles sparse-checkout set resource/Arknights-Tile-Pos
          printf 'TILE_SOURCE_COMMIT=%s\n' "$(git -C upstream-tiles rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Generate and verify deterministic assets
        env:
          RESOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cmp LICENSES/MaaResource-AGPL-3.0.txt upstream-tiles/LICENSE
          python tools/generate.py --source-root upstream --tile-source-root upstream-tiles --output-dir dist --repository "$RESOURCE_REPOSITORY"
          python tools/generate.py --source-root upstream --tile-source-root upstream-tiles --output-dir dist-repeat --repository "$RESOURCE_REPOSITORY"
          cmp dist/resources.json dist-repeat/resources.json
          cmp dist/manifest.json dist-repeat/manifest.json
          python tools/validate.py dist --repository "$RESOURCE_REPOSITORY"
      - name: Publish immutable release or verify an identical existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("dist/manifest.json"))["resourceVersion"])')"
          tag="maa-$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir published
            gh release download "$tag" --pattern resources.json --pattern manifest.json --pattern THIRD_PARTY_NOTICES.md --pattern MaaResource-AGPL-3.0.txt --dir published
            cmp dist/resources.json published/resources.json
            cmp dist/manifest.json published/manifest.json
            cmp THIRD_PARTY_NOTICES.md published/THIRD_PARTY_NOTICES.md
            cmp LICENSES/MaaResource-AGPL-3.0.txt published/MaaResource-AGPL-3.0.txt
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ]; then
              gh release edit "$tag" --draft=false --latest
            fi
            echo "Existing release is byte-identical; no assets replaced."
          else
            printf 'Game data: https://github.com/Kengxxiao/ArknightsGameData/commit/%s\n\nTile projections: https://github.com/MaaAssistantArknights/MaaResource/commit/%s\n\nGenerator: https://github.com/%s/commit/%s\n\nGenerated by manual workflow dispatch. Contains name/ID/route mappings and MAA tile camera/height data. See the attached third-party notices and upstream licence.\n' "$SOURCE_COMMIT" "$TILE_SOURCE_COMMIT" "$GH_REPO" "$GITHUB_SHA" > release-notes.txt
            gh release create "$tag" dist/resources.json dist/manifest.json THIRD_PARTY_NOTICES.md LICENSES/MaaResource-AGPL-3.0.txt --target "$GITHUB_SHA" --title "MAA resources $version" --notes-file release-notes.txt --draft
            gh release edit "$tag" --draft=false --latest
          fi
          printf '### Published MAA resources\n\n- Game data: `%s`\n- Tile maps: `%s`\n- Release: https://github.com/%s/releases/tag/%s\n' "$SOURCE_COMMIT" "$TILE_SOURCE_COMMIT" "$GH_REPO" "$tag" >> "$GITHUB_STEP_SUMMARY"
