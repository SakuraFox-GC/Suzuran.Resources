name: Update mapping resources

# Deliberately manual-only: no schedule, push or pull_request triggers.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: ArknightsGameData branch, tag, or full commit SHA
        required: true
        default: master
        type: string

permissions:
  contents: write

concurrency:
  group: publish-mapping-resources
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out generator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test generator
        run: python -m unittest discover -s tests -v
      - name: Check out three upstream tables at a fixed commit
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Kengxxiao/ArknightsGameData.git upstream
          git -C upstream fetch --depth 1 -- origin "$SOURCE_REF"
          git -C upstream checkout --detach FETCH_HEAD
          git -C upstream sparse-checkout set --no-cone /zh_CN/gamedata/excel/character_table.json /zh_CN/gamedata/excel/char_patch_table.json /zh_CN/gamedata/excel/stage_table.json
          printf 'SOURCE_COMMIT=%s\n' "$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Generate and verify deterministic assets
        env:
          RESOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python tools/generate.py --source-root upstream --output-dir dist --repository "$RESOURCE_REPOSITORY"
          python tools/generate.py --source-root upstream --output-dir dist-repeat --repository "$RESOURCE_REPOSITORY"
          cmp dist/resources.json dist-repeat/resources.json
          cmp dist/manifest.json dist-repeat/manifest.json
          python tools/validate.py dist --repository "$RESOURCE_REPOSITORY"
      - name: Publish immutable release or verify an identical existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="maa-$SOURCE_COMMIT"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir published
            gh release download "$tag" --pattern resources.json --pattern manifest.json --dir published
            cmp dist/resources.json published/resources.json
            cmp dist/manifest.json published/manifest.json
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ]; then
              gh release edit "$tag" --draft=false --latest
            fi
            echo "Existing release is byte-identical; no assets replaced."
          else
            printf 'Source: https://github.com/Kengxxiao/ArknightsGameData/commit/%s\n\nGenerated by manual workflow dispatch. Contains only name/ID/route mapping fields.\n' "$SOURCE_COMMIT" > release-notes.txt
            gh release create "$tag" dist/resources.json dist/manifest.json --target "$GITHUB_SHA" --title "MAA mapping $SOURCE_COMMIT" --notes-file release-notes.txt --draft
            gh release edit "$tag" --draft=false --latest
          fi
          printf '### Published mapping resources\n\n- Source: `%s`\n- Release: https://github.com/%s/releases/tag/%s\n' "$SOURCE_COMMIT" "$GH_REPO" "$tag" >> "$GITHUB_STEP_SUMMARY"
